name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Rebuild the examples
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install three
        run: npm ci --no-audit --no-fund

      - name: Regression tests
        run: |
          test_deps="$(mktemp -d)"
          trap 'rm -rf "$test_deps"' EXIT
          npm install --prefix "$test_deps" --no-audit --no-fund --ignore-scripts react@19.3.0 react-dom@19.3.0 typescript@5.9.3 esbuild@0.28.2
          NODE_PATH="$test_deps/node_modules" node --test scripts/*.test.mjs

      - name: Dial indicator
        run: |
          node examples/dial-indicator/build.mjs
          node examples/dial-indicator/build.mjs --light

      - name: Desk computer
        run: |
          node examples/desk-computer/build.mjs
          node examples/desk-computer/build.mjs --light

      - name: Arcade cabinet
        run: |
          node examples/arcade-cabinet/build.mjs
          node examples/arcade-cabinet/build.mjs --light

      - name: Ripple tank
        run: |
          node examples/ripple-tank/build.mjs
          node examples/ripple-tank/build.mjs --light

      - name: Turning dial
        run: |
          node examples/turning-dial/build.mjs
          node examples/turning-dial/build.mjs --light
          node examples/turning-dial/build.mjs --light --verify
          node examples/turning-dial/stress.mjs --light

      - name: Raptor engine
        run: |
          node examples/raptor-engine/build.mjs
          node examples/raptor-engine/build.mjs --light

      - name: three.js ports
        run: |
          mkdir -p shots
          for name in dial-indicator desk-computer arcade-cabinet raptor-engine ripple-tank test-rig spot-plate turning-dial neuralink heart reactor watch biofield marching-squares; do
            node examples/$name-3d/build.mjs --check
            node examples/$name-3d/build.mjs
            node examples/$name-3d/build.mjs --light
            for page in $name-3d $name-3d-light; do
              node scripts/capture.mjs examples/$name-3d/$page.html --out shots/$page.png --times 2400 2>&1 | tee shots/$page.txt
              grep -q "readout" shots/$page.txt
              if grep -Eiq "console\.(error|warning)|exception" shots/$page.txt; then exit 1; fi
            done
            node scripts/capture.mjs examples/$name-3d/$name-3d.html --out shots/$name-3d-phone.png --width 390 --reduced 2>&1 | tee shots/$name-3d-phone.txt
            if grep -Eiq "console\.(error|warning)|exception|scrolls sideways: yes" shots/$name-3d-phone.txt; then exit 1; fi
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-shots
          path: shots/*.png
          if-no-files-found: ignore

      - name: Committed pages are unchanged
        run: |
          git status --short
          git diff --stat --exit-code
          test -z "$(git status --porcelain)"
